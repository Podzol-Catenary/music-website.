<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Novel Viewer</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<!-- ==========================
      本全体
========================== -->

<div id="viewer">

    <!-- 左矢印 -->

    <button
        id="prevButton"
        class="arrow left"
        aria-label="前のページ">

        ❮

    </button>

    <!-- 本 -->

    <div id="book">

        <!-- =====================
              表紙
        ====================== -->

        <section
            id="cover"
            class="cover">

            <div class="coverInner">

                <h1 id="bookTitle">

                    猫耳少女にまつわる幾つかの不思議な物語

                </h1>

                <h2 id="subTitle">

                    猫耳少女/三上夏帆

                </h2>

                <p id="author">

                   Podzol

                </p>

                <button
                    id="startButton">

                    読み始める

                </button>

            </div>

        </section>

        <!-- =====================
              本文
        ====================== -->

        <section
            id="pages"
            class="hidden">

            <!-- 右ページ -->

            <article
                class="page"
                id="rightPage">

                <div
                    class="pageNumber"
                    id="rightNumber">

                    1

                </div>

                <div
                    class="pageContent"
                    id="rightContent">

                </div>

            </article>

            <!-- 左ページ -->

            <article
                class="page"
                id="leftPage">

                <div
                    class="pageNumber"
                    id="leftNumber">

                    2

                </div>

                <div
                    class="pageContent"
                    id="leftContent">

                </div>

            </article>

        </section>

        <!-- =====================
              裏表紙
        ====================== -->

        <section
            id="backCover"
            class="cover hidden">

            <div class="coverInner">

                <h1>

                    終

                </h1>

                <p>

                    おしまい。

                </p>

            </div>

        </section>

    </div>

    <!-- 右矢印 -->

    <button
        id="nextButton"
        class="arrow right"
        aria-label="次のページ">

        ❯

    </button>

</div>

<!-- ==========================
      JavaScript
========================== -->

<script src="pages.js"></script>

<script src="script.js"></script>

</body>

</html>
