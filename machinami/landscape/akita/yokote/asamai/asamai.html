 <section>
<h3>浅舞の街並み</h3>
<p>探訪:2023.2<br>
 <br>
 横手市街から南西へ10kmほど、のどかな田園風景が広がる平野地のなかに浅舞の街並みはある。中世浅舞城の城下町として、また古くからの街道の要所として栄え、街並みには東北特有の妻壁の立派な旧家が点在しているほか、洋館も現存している。<br>
