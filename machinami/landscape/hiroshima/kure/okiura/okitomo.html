<h1>広島県呉市豊町 沖友(大崎下島)</h1>

 <section>
<h3>沖友の風景</h3>
<p>探訪:2025, 撮影:Fujifilm X-T2<br>
<br>
大崎下島の南部、島を回り込んだ先にある四国の見える集落。沖友天満宮の神社と港を囲んで瓦屋根の古い集落が広がり、その背後の山には柑橘類の段々畑が幾重にも造られている。<br>
戦前から戦後期にかけては柑橘類で大いに栄えたらしく、同じく沖友「みかんメッセージ館」には沖友の地名がはいったみかんのチラシが展示されているほか、集落の山手近くに立派な西洋風の古民家も残る。<br></p>
