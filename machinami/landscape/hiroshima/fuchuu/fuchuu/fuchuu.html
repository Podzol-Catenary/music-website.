<h1>広島県府中市</h1>

 <section>
<h3>府中市街の街並み</h3>
<p>探訪:2025.2<br>
<br>
今から1300年ほど昔、古代の頃に備後国を収める国府がおかれたことが市名の由来。旧山陽道、旧石州街道など主要な街道筋沿いの街並みとして発展し、明治以降は木工家具の生産でも知られる。<br>
街並みには登録有形文化財の「平地呉服店」「恋しき」をはじめとして近代建築が多く現存する。
<br></p>
