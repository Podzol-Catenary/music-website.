 <section>
<h3>木江の街並み</h3>
<p>探訪:2021-2026, 撮影:Fujifilm X-T2<br>
<br>
竹原市の沖合に浮かぶ離島、大崎上島。その島の東部に形成された小集落。<br>
古くは瀬戸内海航路の中継地として船が多く集まり遊郭として栄えた歴史を持つが、現在は遊郭由来の建物の多くが解体されており、面影はわずかに残るのみとなっている。<br></p>
