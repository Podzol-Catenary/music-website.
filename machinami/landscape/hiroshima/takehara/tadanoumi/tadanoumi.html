<h1>広島県竹原市 忠海</h1>

 <section>
<h3>忠海の街並み</h3>
<p>探訪:2026.1 撮影:Fujifilm X-T2<br>
<br>
広島県の南部、瀬戸内海に面した港町。海を挟んだ向かいには、太平洋戦争時の遺構が多く残り、今はウサギの島として有名な大久野島がある。<br>
忠海駅近くの桟橋から、大久野島〜盛港（大三島・愛媛県）が運航されている。<br>
古い街並みは道路拡張で失われつつあるが、わずかに瓦屋根の旧家などが現存している。<br></p>
