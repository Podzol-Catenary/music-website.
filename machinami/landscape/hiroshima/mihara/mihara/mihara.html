<h1>広島県三原市</h1>

 <section>
<h3>三原の街並み</h3>
<p>探訪:2025.12 撮影:Fujifilm X-T2<br>
<br>
広島県南部、海に面して広がる街並み。山陽本線の駅からすぐの場所に港があり、生名島、佐木島、因島など周辺の島嶼を結んでいるほか、三原駅は呉線と山陽本線の分岐駅であるなど、陸・海の交通の要所である。<br>
駅の北側と南側に分かれて古い街並みがわずかに現存しており、三階建ての塔屋が立つ旧眼科医院の洋館など見応えがある。</p>
