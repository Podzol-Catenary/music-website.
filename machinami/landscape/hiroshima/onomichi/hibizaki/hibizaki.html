<h1>広島県尾道市 日比崎町</h1>

 <section>
<h3>日比崎町の街並み</h3>
<p>探訪:2026.4<br>
<br>
尾道駅西側、小高い山の裾野に沿って広がる坂の街。石垣と路地階段の風景に、尾道市迎賓館（旧個人邸）の洋館付き邸宅など近代住宅がひしめくように立ち並び、独特の景観をなしている。<br>
山手の路地を入ったあたりに、大林監督の映画ロケ地として使われた近代建築も残っていると聞く。<br>
<br></p>
