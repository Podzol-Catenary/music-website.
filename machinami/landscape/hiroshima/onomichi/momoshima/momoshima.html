<h1>広島県尾道市 百島町</h1>

 <section>
<h3>百島の街並み</h3>
<p>探訪:2021-2026<br>
<br>
瀬戸内海芸予諸島、尾道港から船で30分ほどの沖合に浮かぶ小島。島には商店や飲食コーナーがあるほか旧学校を利用したアート関係の施設もあり、島内では比較的若い世代を見かける。<br>
島の集落に残る旧支所の建築が登録有形文化財に指定されており、旧劇場跡の建物も残るなど見所が多い。
<br></p>
