<h1>広島県尾道市 御調町 市</h1>

 <section>
<h3>市の街並み</h3>
<p>探訪:2025.2<br>
<br>
港町として有名な尾道市であるが、内陸側にも広大な市域が広がっており御調町は尾道市北部の山野部に位置する。<br>
御調町、市地区の街並みは古代山陽道と旧石見銀山街道の交差地点として古くから栄え、その歴史にちなんで現在も道の駅の名前が「クロスロード」となっているほか、街並みには旧郵便局や旧医院の洋館など戦前建物が現存する。
<br></p>
