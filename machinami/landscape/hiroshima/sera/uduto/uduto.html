 <section>
<h3>宇津戸の街並み</h3>
<p>探訪:2020.8/2026.5<br>
<br>
広島県のほぼ中央、中国山地に位置する世羅町、その世羅町の南端に位置するのが宇津戸の街並みである。古くは石見銀山街道の道筋の街として発展し、現在も商家など歴史的な建物がわずかに現存する。<br>
近代洋風の造りで意匠が凝らされた旧宇津戸郵便局舎は2021年頃に解体された。
<br></p>
