 <section>
<h3>世羅甲山の街並み</h3>
<p>探訪:2025.2<br>
<br>
甲山地区は世羅町の中心地域である。紀州高野山が西の拠点とした甲山今高野山には寺社仏閣関係の史跡が多く残り、遠方からも参拝客が訪れる。<br>
街並みは芦田川の河畔に門前町として発展し、旧旅館の和風建築や土産物店の洋風建築など歴史を感じられる建物もみられる。
<br></p>
