<h3>比和町比和の街並み</h3>
<p>探訪:2025.2 撮影:Fujifilm X-T2<br>
<br>
広島県北部、豪雪地帯として有名な中国山地の奥深くにある街並み。<br>
庄原市街地から北へ10km以上離れているものの、周辺の山間地域の中心部として栄えたのか見事な昭和の商店街が残っており、比和川の流れに沿って銀行や郵便局、商店、医院などの建物が並ぶ様は壮観。</p>
