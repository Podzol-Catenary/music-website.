<style>
/* 地方ごとのまとまり */
.region {
    margin-bottom: 40px;
}

/* 写真を横並びにする */
.photo-list {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

/* 1県分のカード */
.photo-card {
    width: 200px;
    text-align: center;
}

/* 写真 */
.photo-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    border-radius: 8px;
    transition: opacity 0.3s;
}

/* マウスを乗せたとき */
.photo-card img:hover {
    opacity: 0.7;
}

/* 県名 */
.photo-card p {
    margin-top: 8px;
    font-size: 16px;
}
</style>

</head>
