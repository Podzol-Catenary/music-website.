<h1>香川県香川郡 直島</h1>

 <section>
<h3>直島の街並み</h3>
<p>探訪:2026.1<br>
岡山県玉野市の沖合に浮かぶ小島。大正時代、島の北部に三菱鉱業の精錬所がおかれ工業地化が進められた。<br>
近年はベネッセ主導の企画でアートの島として知られるようになり、島内には美術館や草間彌生製作のオブジェがあるほか、瓦屋根の古い街並みもわずかに残っている。<br></p>
