<h1>香川県小豆郡 豊島家浦</h1>

 <section>
<h3>家浦の街並み</h3>
<p>探訪:2026.1<br>
瀬戸内海、小豆島の西方に浮かぶ小島。集落は大きく家浦、唐櫃、甲生と三つに別れて点在しており、島内バスが運行している。<br>
家浦は島の北西部にある集落で、宇野港ー小豆島を結ぶフェリーが発着している。集落には黄土色の石を積み上げた石垣が多く見られ、瓦屋根の街並みと相まって特徴的な景観を成している。<br>
