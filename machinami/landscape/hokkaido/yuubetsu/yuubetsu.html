<h1>北海道紋別郡 湧別町</h1>

 <section>
<h3>湧別の街並み</h3>
<p>探訪:2022.11<br>
 道東地方、遠軽の街から北へ10kmほどの平野に広がる街並みで、南から順に上湧別、中湧別、湧別と三つの集落に分かれており、それぞれ4kmほど離れている。<br>
 上湧別には戦前に建てられた材木商の洋館、旧熊沢商店洋館が残る。中湧別には道の駅、旅館、戦前創業の森食料品店がある（※森食料品店は2025年閉業した）<br>
　湧別の本町はオホーツク海に面し魚市場があるほか、旧劇場跡や郷土資料館がある。</p>
