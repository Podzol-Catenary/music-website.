 <section>
<h3>遠軽の街並み</h3>
<p>探訪:2022, 撮影:Nikon D3100<br>
 道東地方、旧名寄本線・石北本線の結節点として古くから栄える。街並みにはキリスト教会や赤煉瓦の建物など近代建築が複数現存する。<br>
 名寄本線が廃止されて以降は石北線のスイッチバック（列車の進行方向が変わる）駅として有名。<br></p>
