<h1>愛知県名古屋市</h1>

 <section>
<h3>名古屋の街並み</h3>
<p>探訪:2023.10, 撮影:Fujifilm X-T2<br>
中部地方最大都市、名古屋。江戸時代には徳川家が治める城下町として栄えたほか、近代以降も周辺地域の経済的中心地として栄える。<br>
古い街並みとしては、名古屋駅西側に遊郭跡が残るほか、市内の各地に和洋折衷の近代文化住宅が多数現存する。<br></p>
