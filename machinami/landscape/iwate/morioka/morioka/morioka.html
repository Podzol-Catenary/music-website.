 <section>
<h3>盛岡市街の街並み</h3>
<p>探訪:2026.1, 撮影:Fujifilm XT2<br>
<br>
2025年〜2026年の年末年始にかけて東北・北海道を巡った。広島から新幹線を乗り継いで最初に訪れたのがここ盛岡で、駅を出ると雪が盛んに降りしきり久々に雪道を歩く感覚に感動を覚えた。<br>
市街地には東北出身の作家を紹介する「もりおか啄木・賢治記念館」や、岩手銀行赤レンガ館、人魚のレリーフが見事な小原写真館など名建築が多数みられる。<br>

<br></p>
