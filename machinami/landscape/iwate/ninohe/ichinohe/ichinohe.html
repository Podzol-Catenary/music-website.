<h1>岩手県二戸郡 一戸町</h1>

 <section>
<h3>一戸町の街並み</h3>
<p>探訪:2026.1, 撮影:Fujifilm XT2, Nikon FM2 + Fujicolor200(Film)<br>
<br>
〇〇の戸(へ)という地名が東北の岩手〜青森県境周辺に多く見られる。もともと平安時代から鎌倉時代にかけて良質な馬を産出したことからこの地域一体を9つの地区に分けて管理したことに由来するという。<br>
一戸町は岩手県北部、馬淵川の流れに沿って古い町並みが残っている。一戸駅を降り北側へ県道を歩くとすぐに重厚な商家が姿を現し、特に向町から本町にかけての板張り・トタン屋根の日本家屋が連なる様は圧巻。
<br></p>
