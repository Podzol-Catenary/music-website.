<h1>東京都北区 赤羽</h1>

 <section>
<h3>赤羽の街並み</h3>
<p>探訪:2026.6<br>
<br>
荒川沿いに形成された街並みで、荒川を挟んだ対岸は埼玉県となる。鉄道結節点として栄え、駅周辺には繁華街が形成されている。荒川沿いには数メートルの高低差を持つ崖線がみられ、そのうえに街並みが形成されているために住宅街には坂道や階段が多く見られる。<br>
赤羽岩淵駅から徒歩圏内に荒川放水路の分岐点に当たる岩淵水門がある。<br></p>
