<h1>東京都墨田区 駒形/本所</h1>

 <section>
<h3>駒形/本所の街並み</h3>
<p>探訪:2026.2<br>
<br>
浅草の雷門から仲見世商店街を真っ直ぐ南下してゆくと、東側に一際大きな水色のアーチ橋が見えてくる。関東大震災の復興橋梁として設計された昭和2年竣工の駒形橋で、これを渡ると墨田区駒形へと至る。<br>
駒形/本所のエリアは比較的区画が格子状に整のっており、荒井湯のような昭和の銭湯が残るなど下町風情の残る街並みである。<br>
<br></p>
