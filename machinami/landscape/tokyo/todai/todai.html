<h1>東京都文京区本郷/弥生 東大キャンパス内</h1>

 <section>
<h3>東京大学キャンパス内の風景</h3>
<p>探訪:2026.6<br>
<br>
東京大学はその広大なキャンパス内に関東大震災や東京大空襲の被害を免れた戦前建築が多く現存しており、そのほとんどが現役で使用されている。<br>
農学部、工学部、法学部などの西洋建築にはアーチ形状の玄関口とパターン化された装飾が共通してみられ、これらは設計者の内田祥三の名前にちなんで「内田ゴシック」と呼ばれる。<br>
<br></p>
