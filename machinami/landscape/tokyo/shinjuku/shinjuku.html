<h1>東京都新宿区 新宿の街並み</h1>

 <section>
<h3>新宿の街並み</h3>
<p>探訪:2026<br>
<br>
日本一の乗降者数を誇るターミナル駅、新宿駅。駅周辺では再開発が進められており、訪れるたびに歩行経路が変わっていて混乱しがちである。<br>
駅東側には新宿御苑があるほか夜の街、新宿歌舞伎町が広がる。西口にはヨドバシカメラやヤマダデンキなど電気店が多く見られるほか、丹下健三設計による東京都庁も聳え立つ。<br>
板倉準三設計、1966年竣工の新宿駅西口広場は立体的で曲線的な構造が特徴の昭和遺産であったが再開発に伴い解体されつつある。<br>
<br></p>
