<h1>岡山県和気郡 和気町</h1>

 <section>
<h3>和気の街並み</h3>
<p>探訪:2023.1, 撮影:Nikon D3100<br>
<br>
岡山県南部、吉井川と金剛川の合流する場所に形成された川沿いの街並み。真庭市の旧遷喬尋常小学校、倉敷市の歴史民俗資料館など岡山県内の洋風建築を多く設計した江川三郎八による建築、旧永井歯科医院の洋館が残る。<br>
2020年頃まで装飾意匠が特徴的な旧和気郵便局の洋館が残っていたが、解体され現存しない。
<br></p>
