<h1>岡山県真庭市 久世地区</h1>

 <section>
<h3>久世の街並み</h3>
<p>探訪:2022.10, 撮影:Nikon D3100<br>
<br>
岡山県北部、旭川の流れに沿って形成された街並みで、旧出雲街道沿いの宿場町として発展した。旧道に沿って白壁の旧家が点在するほか、国重要文化財に指定されている明治時代の洋館建築、旧遷喬尋常小学校など歴史を感じられる風景が残っている。
<br></p>
