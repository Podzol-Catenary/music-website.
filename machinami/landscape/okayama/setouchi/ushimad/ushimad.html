<h1>岡山県瀬戸内市 牛窓町</h1>

 <section>
<h3>牛窓の街並み</h3>
<p>探訪:2025.6, 撮影:Fujifilm X-T2<br>
<br>
岡山県南部、瀬戸内海に面した港町。海と島の見えるのどかな風景と、古民家を改装した喫茶店などもあり観光地として人気。<br>
赤煉瓦造の洋館、旧中国銀行牛窓支店の建物が保存されている他、旧病院の建物を改装したテナント施設「牛窓テレモーク」には飲食店のほかアトリエやスタジオも入り、若い世代の交流の場となっている。
<br></p>
