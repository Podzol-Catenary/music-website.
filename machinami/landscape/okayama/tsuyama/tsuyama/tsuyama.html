<h1>岡山県津山市</h1>

 <section>
<h3>津山の街並み</h3>
<p>探訪:2022.10, 撮影:Nikon D3100<br>
<br>
岡山県北部、吉井川沿いに広がる街並みで岡山県北地方では最大規模の都市である。 <br>
津山藩の城下町として栄えた歴史をもち、現在でも城周辺には重伝建に指定されている白壁の街並みが残るほか、森本慶三記念館（旧津山基督教図書館）、城東むかし町屋（旧梶村家住宅）など西洋意匠を凝らした近代建築も多く現存し見応えがある。
<br></p>
