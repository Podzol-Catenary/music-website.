<h1>岡山県玉野市 宇野地区</h1>

 <section>
<h3>宇野の街並み</h3>
<p>探訪:2026.1<br>
<br>
岡山県南部、瀬戸内海に面した港町。明治時代に鉄道が整備され宇野港より四国との連絡船が運航するようになり、本州四国連絡航路の発着地として栄えた。<br>
瀬戸大橋の架橋に伴い航路の需要が低下し、現在は宇野・高松間を直行で結ぶ航路は運行されていないが、途中で直島を経由するなど島嶼部を結ぶフェリーを利用して向かうことができる。<br>
なお、玉野の市名は、市内で栄えていた宇野地区と玉地区の二つの地区からそれぞれ一文字ずつ取ってつけられている。
<br></p>
