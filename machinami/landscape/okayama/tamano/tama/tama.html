<h1>岡山県玉野市 玉地区</h1>

 <section>
<h3>玉の街並み</h3>
<p>探訪:2026.1, 撮影:Fujifilm XT-2<br>
<br>
岡山県南部、瀬戸内海に面した港町。 大正時代に三井物産の造船部として創業した玉造船所（三井造船）の企業城下町として栄えた。<br>
海沿いには造船所のクレーンが高く並び、造船関連施設として迎賓館の戦前建築が残るほか、個人邸の洋館、商店街の看板建築など歴史的建物が多い。<br>
なお、玉野の市名は、市内で栄えていた宇野地区と玉地区の二つの地区からそれぞれ一文字ずつ取ってつけられている。
<br></p>
